name: Sincronizar vault

# En cada cambio a main y cada 15 minutos: publica en main el archivo de tareas
# de cada integrante, regenera los índices, el tablero de tareas y novedades.md,
# y propaga main a la rama de cada integrante.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"  # tareas y tablero; incluye la medianoche de la Ciudad de México
  workflow_dispatch:

concurrency:
  group: sincronizar-vault
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.VAULT_BOT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Git
        run: |
          git config user.name "vault-bot"
          git config user.email "vault-bot@users.noreply.github.com"

      - name: Instalar gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Publicar las tareas de cada integrante
        env:
          GH_TOKEN: ${{ secrets.VAULT_BOT_TOKEN }}
        run: python scripts/publicar_tareas.py

      - name: Regenerar índices, tablero de tareas y novedades
        run: |
          python scripts/generar_indices.py
          python scripts/generar_tablero.py
          python scripts/generar_novedades.py
          if [[ -n "$(git status --porcelain -- tec)" ]]; then
            git add tec
            git commit -m "chore: regenerar índices, tablero y novedades [skip ci]"
          fi
          if [[ -n "$(git log origin/main..HEAD --oneline)" ]]; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Propagar main a las ramas de los integrantes
        env:
          GH_TOKEN: ${{ secrets.VAULT_BOT_TOKEN }}
        run: bash scripts/propagar_main.sh
